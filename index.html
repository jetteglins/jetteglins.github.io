<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gute Stube - der Katalog</title>
    <style>
        /* Einbindung der Projektschriften */
       
      
        @font-face {
    font-family: 'Rusch R-Bizarre';
    src: url('./fonts/rusch-r-bizarre.woff2') format('woff2'),
         url('./fonts/rusch-r-bizarre.woff') format('woff');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Verdana', sans-serif;
            background-color: #ffdced;
            color: #111;
            line-height: 1.5;
            padding: 40px 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            border-bottom: 2px solid #ff4444;
            padding-bottom: 20px;
        }

        h1 {
            
            font-family: 'Rusch R-Bizarre', 'Times New Roman', serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: solid #ff4444;
        }

        .controls {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            font-family: 'Rusch R-Bizarre', 'Times New Roman', serif;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: bold;
            color: #444;
        }

        select {
            font-family: 'Verdana', sans-serif;
            font-size: 0.9rem;
            padding: 8px 12px;
            border: 1px solid #111;
            background-color: #fff;
            min-width: 180px;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            background-color: #f0f0f0;
        }

        .results-count {
            margin-left: auto;
            font-size: 0.85rem;
            color: #666;
        }

       
        .grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

     
        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .image-container {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f3f3;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .item-number {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 5px;
        }

        .card h3 {
            font-size: 1.05rem;
            margin-bottom: 15px;
            font-weight: bold;
            flex-grow: 1; 
        }

        .card-meta {
            font-size: 0.8rem;
            border-top: 1px solid #eee;
            padding-top: 10px;
            color: #444;
        }

        .card-meta div {
            margin-bottom: 4px;
        }

        .card-meta span {
            font-weight: bold;
        }

       
        @media (max-width: 768px) {
            .results-count {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="main-title">Gute Stube</h1>
        <div class="subtitle">Katalog eines Wohnzimmers <br>Gestaltet von Jette Glinsmann</div>
    </header>

    <div class="controls">
        <div class="control-group">
            <label for="materialFilter">Material</label>
            <select id="materialFilter">
                <option value="all">Alle Materialien</option>
            </select>
        </div>

        <div class="control-group">
            <label for="farbeFilter">Farbe</label>
            <select id="farbeFilter">
                <option value="all">Alle Farben</option>
            </select>
        </div>

        <div class="control-group">
            <label for="sortOrder">Sortierung</label>
            <select id="sortOrder">
                <option value="none">Standard (Objekt-Nr.)</option>
                <option value="az">Alphabetisch (A-Z)</option>
                <option value="za">Alphabetisch (Z-A)</option>
            </select>
        </div>

        <div class="results-count" id="resultsCount">0 Objekte gefunden</div>
    </div>

    <main class="grid" id="catalogGrid">
        </main>

    <script>
        let catalogData = [];

        // DOM-Elemente
        const grid = document.getElementById('catalogGrid');
        const materialFilter = document.getElementById('materialFilter');
        const farbeFilter = document.getElementById('farbeFilter');
        const sortOrder = document.getElementById('sortOrder');
        const resultsCount = document.getElementById('resultsCount');

        // 1. JSON-Daten laden
        fetch('csvjson.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Netzwerk-Antwort war nicht ok');
                }
                return response.json();
            })
            .then(data => {
                catalogData = data;
                populateFilters(data);
                filterAndSort(); // Initiales Rendern
            })
            .catch(error => {
                console.error('Fehler beim Laden der JSON:', error);
                grid.innerHTML = `<p style="grid-column: 1/-1; color: red;">Fehler beim Laden der Katalogdaten. Bitte stelle sicher, dass die Seite über einen lokalen Server läuft.</p>`;
            });

        // 2. Filteroptionen dynamisch aus den Daten generieren
        function populateFilters(data) {
            const materialSet = new Set();
            const farbenSet = new Set();

            data.forEach(item => {
                // Materialien aufteilen (falls kommagetrennt z.B. "Holz, Stoff")
                if (item.Material) {
                    item.Material.split(',').forEach(m => materialSet.add(m.trim()));
                }
                // Farben aufteilen
                if (item.Farbe) {
                    item.Farbe.split(',').forEach(f => farbenSet.add(f.trim()));
                }
            });

            // Sortieren und Optionen in das Dropdown einfügen
            Array.from(materialSet).sort().forEach(mat => {
                if(mat) {
                    const opt = document.createElement('option');
                    opt.value = mat;
                    opt.textContent = mat;
                    materialFilter.appendChild(opt);
                }
            });

            Array.from(farbenSet).sort().forEach(col => {
                if(col) {
                    const opt = document.createElement('option');
                    opt.value = col;
                    opt.textContent = col;
                    farbeFilter.appendChild(opt);
                }
            });
        }

        // 3. Render-Funktion für das Raster
        function renderCatalog(items) {
            grid.innerHTML = '';
            resultsCount.textContent = `${items.length} ${items.length === 1 ? 'Objekt' : 'Objekte'} gefunden`;

            if (items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; color: #666;">Keine Objekte entsprechen den ausgewählten Filtern.</p>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('article');
                card.className = 'card';
                
               // Pfad zum Bild zusammenbauen
let imagePath = item['@image'] || (item.PathExtension + item.FileNames);

// Wichtig für GitHub Pages: Wenn der Pfad mit einem Schrägstrich beginnt, entfernen wir ihn,
// damit es ein rein relativer Pfad bleibt.
if (imagePath.startsWith('/')) {
    imagePath = imagePath.substring(1);
}

                card.innerHTML = `
                    <div class="image-container">
                        <img src="${imagePath}" alt="${item.Bezeichnung || 'Katalogobjekt'}" loading="lazy">
                    </div>
                    <div class="item-number">${item.ObjektNummer || ''}</div>
                    <h3>${item.Bezeichnung || 'Ohne Bezeichnung'}</h3>
                    <div class="card-meta">
                        <div><span>Material:</span> ${item.Material || '—'}</div>
                        <div><span>Farbe:</span> ${item.Farbe || '—'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 4. Filter- und Sortier-Logik
        function filterAndSort() {
            let filtered = [...catalogData];

            // Filter nach Material
            const selectedMaterial = materialFilter.value;
            if (selectedMaterial !== 'all') {
                filtered = filtered.filter(item => 
                    item.Material && item.Material.split(',').map(m => m.trim()).includes(selectedMaterial)
                );
            }

            // Filter nach Farbe
            const selectedFarbe = farbeFilter.value;
            if (selectedFarbe !== 'all') {
                filtered = filtered.filter(item => 
                    item.Farbe && item.Farbe.split(',').map(f => f.trim()).includes(selectedFarbe)
                );
            }

            // Sortierung anwenden
            const selectedSort = sortOrder.value;
            if (selectedSort === 'az') {
                filtered.sort((a, b) => {
                    const bezA = a.Bezeichnung || '';
                    const bezB = b.Bezeichnung || '';
                    return bezA.localeCompare(bezB, 'de', { sensitivity: 'base' });
                });
            } else if (selectedSort === 'za') {
                filtered.sort((a, b) => {
                    const bezA = a.Bezeichnung || '';
                    const bezB = b.Bezeichnung || '';
                    return bezB.localeCompare(bezA, 'de', { sensitivity: 'base' });
                });
            }

            renderCatalog(filtered);
        }

        // Event-Listener aktivieren
        materialFilter.addEventListener('change', filterAndSort);
        farbeFilter.addEventListener('change', filterAndSort);
        sortOrder.addEventListener('change', filterAndSort);
    </script>
    <footer style="max-width: 1200px; margin: 60px auto 0 auto; padding: 20px 0; border-top: 1px solid #ddd; font-size: 0.8rem; color: #666;">
    <p>© 2026 Jette Glinsmann — Kurs: It’s not a Book! … It’s a catalog</p>
    <details style="margin-top: 10px; cursor: pointer;">
        <summary><strong>Impressum anzeigen</strong></summary>
        <div style="margin-top: 10px; line-height: 1.6; color: #111;">
            <p><strong>Gestaltung & Fotos:</strong> Jette Glinsmann<br>
            jette.glinsmann@outlook.com</p>
            <p style="margin-top: 8px;"><strong>Typografie:</strong> Verdana & RUSCH 'R-BIZARRE' PROTO-ROMAN 103R</p>
        </div>
    </details>
</footer>
</body>
</html>
